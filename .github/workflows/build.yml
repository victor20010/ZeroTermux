name: Build

on:
  [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Clone repository
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure JitPack authentication
        run: |
          mkdir -p ~/.gradle
          echo "allprojects { repositories { maven { url 'https://jitpack.io' } } }" > ~/.gradle/init.gradle

      - name: Update build.gradle
        run: |
          sed -i 's/compile(/implementation(/g' app/build.gradle
          sed -i 's/provided group:/compileOnly group:/g' app/build.gradle

      - name: Build APKs
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Upload outputs dir
          path: |
            ./app/build/outputs/*
          retention-days: 7
